model:
  max_position_embedding: 514
  num_attention_heads: 12
  num_hidden_layers: 12
  hidden_size: 768
  type_vocab_size: 1

tokenizer:
  tokenizer_path: "data/tokenized/bpe_tokenizer.json"
  tokenizer_vocab_size: 32000

train:
  epochs: 2
  save_total_limit: 2
  per_device_train_batch_size: 64
  bf16: true
  dataloader_num_workers: 8
