model:
  vocab_size: 32768
  max_position_embeddings: 514
  num_attention_heads: 12
  num_hidden_layers: 12
  hidden_size: 768
  type_vocab_size: 1

tokenizer:
  tokenizer_path: "./data/tokenized/bpe_tokenizer.json"
  tokenizer_vocab_size: 32768
  pad_token: "<pad>"
  unk_token: "<unk>"
  mask_token: "<mask>"
  cls_token: "<s>"
  bos_token: "<s>"
  sep_token: "</s>"
  eos_token: "</s>"

train:
  output_dir: "./experiments/roberta_run_1"
  eval_strategy: "steps"
  num_train_epochs: 1
  #max_steps: 2
  eval_steps: 500
  save_steps: 500
  save_total_limit: 2
  per_device_train_batch_size: 64
  bf16: true
  dataloader_num_workers: 8
  logging_steps: 50

data:
  path: "./data/tokenized"

meta:
  report_to: "wandb"
  run_name: "test-run-1-base-124M_1"
  project_name: "[midas]_latin_roberta"
  tags: "roberta"
  group: "base_models"
