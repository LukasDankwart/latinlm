model:
  vocab_size: 32768
  hidden_size: 768
  intermediate_size: 2048
  num_hidden_layers: 12
  num_attention_heads: 12
  num_key_value_heads: 4
  max_position_embeddings: 2048
  rms_norm_eps: 1.0e-5
  initializer_range: 0.02
  use_cache: True
  tie_word_embeddings: False

tokenizer:
  tokenizer_path: "tokenizer/bpe_tokenizer.json"
  tokenizer_vocab_size: 32768
  pad_token: "<pad>"
  unk_token: "<unk>"
  mask_token: "<mask>"
  cls_token: "<s>"
  bos_token: "<s>"
  sep_token: "</s>"
  eos_token: "</s>"

train:
  output_dir: "./experiments/llama_run_1"
  eval_strategy: "steps"
  save_strategy: "steps"
  num_train_epochs: 10

  eval_steps: 500
  save_steps: 500
  save_total_limit: 10

  per_device_train_batch_size: 64
  gradient_accumulation_steps: 2
  gradient_checkpointing: true

  bf16: true
  dataloader_num_workers: 8
  optim: "adamw_torch_fused"

  learning_rate: 0.0006
  weight_decay: 0.1
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  max_grad_norm: 1.0

  # Checkpoint policy
  logging_steps: 50
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  greater_is_better: false

data:
  path: "./data/llama/"

meta:
  report_to: "wandb"
  run_name: "run-1-llama-126M-10epochs"
  project_name: "[midas]_latin_llama"
  tags: "llama"
  group: "base_models"


