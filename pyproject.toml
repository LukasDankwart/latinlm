[project]
name = "latinlm"
version = "0.1.0"
description = "Repository for LatinLLM development"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Lukas Dankwart", email = "lukas.dankwart@tu-dortmund.de" },
    { name = "Mustafa Yalciner", email = "mustafa.yalciner@tu-dortmund.de" }
]
dependencies = [
    "torch>=2.2.0",
    "datasets>=2.19.0",
    "tokenizers>=0.19.0",
    "lingua-language-detector>=2.1.1",
    "rich>=15.0.0",
    "transformers>=5.12.1",
    "accelerate>=1.14.0",
    "wandb>=0.27.2",
    "conllu>=6.0.0",
    "duckdb>=1.5.4",
    "cltk>=1.5.0",
    "lxml>=6.1.1",
    "datasketch>=2.0.0",
    "openai>=2.47.0",
    "python-dotenv>=1.2.2",
    "matplotlib>=3.11.1",
]

[tool.uv.sources]
torch = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[dependency-groups]
dev = [
    "jupyter>=1.0.0",
    "black>=24.0.0",
    "flake8>=7.0.0",
]
