[project]
name = "latinlm"
version = "0.1.0"
description = "Repository for LatinLLM development"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Lukas Dankwart", email = "lukas.dankwart@tu-dortmund.de" },
    { name = "Mustafa Yalciner", email = "mustafa.yalciner@tu-dortmund.de" }
]
dependencies = [
    "torch>=2.2.0",
    "datasets>=2.19.0",
    "tokenizers>=0.19.0",
    "lingua-language-detector>=2.1.1",
    "rich>=15.0.0",
    "transformers>=5.12.1",
    "accelerate>=1.14.0",
    "wandb>=0.27.2",
]

[dependency-groups]
dev = [
    "jupyter>=1.0.0",
    "black>=24.0.0",
    "flake8>=7.0.0",
]
